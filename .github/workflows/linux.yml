name: Experimental Linux build
on:
  push:
    branches: [main, steam-deck-linux, fix/steam-deck-glx]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libgl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libasound2-dev libpulse-dev libudev-dev \
            ffmpeg xvfb mesa-utils
      - name: Clean configure and build
        # tools/build_linux.sh deletes build-linux first: SDL2 caches its
        # X11/GLX probes, so a reused tree can silently keep GLX disabled.
        run: JOBS=2 tools/build_linux.sh
      - name: Report the compiled SDL2 video backends
        run: |
          config=build-linux/_deps/sdl2-build/SDL_config.h.intermediate
          grep -E '^#define SDL_VIDEO_(DRIVER_X11|OPENGL_GLX) 1' "$config"
          if readelf -d build-linux/opengt4 | grep -q 'libSDL2'; then
            echo 'opengt4 must link SDL2 statically' >&2
            exit 1
          fi
      - name: Create a real X11/GLX window without a disc
        # The startup failure this job guards against happens before any disc
        # is opened, so it is reproducible with Xvfb and Mesa's software GL.
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            env SDL_VIDEODRIVER=x11 ./build-linux/opengt4 --video-check
      - name: Validate without game data
        run: |
          ctest --test-dir build-linux --output-on-failure \
            -R '^(launcher_config|launcher_config_negative|native_media|native_sound|menu_music_prefix_negative|movie_posix|appimage_launcher)$'
      - name: Check packaging scripts
        run: |
          sh -n packaging/linux/AppRun
          bash -n tools/package_appimage.sh
          bash -n tools/build_ffmpeg_minimal.sh
          bash -n tools/build_linux.sh
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: build-linux/Testing/Temporary/LastTest.log
